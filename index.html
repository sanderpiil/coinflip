<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coinflip — Yes or No</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", "SF Pro Text", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, #f7f8ff, #d5d9ff 45%, #9aa2ff);
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #10132f;
      }

      .card {
        width: min(420px, 90vw);
        background: rgba(255, 255, 255, 0.86);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(24, 32, 79, 0.2);
        padding: 2.5rem 2rem;
        text-align: center;
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.75rem;
      }

      p {
        margin: 0 0 2rem;
        color: #3b3f6b;
      }

      .coin-wrapper {
        position: relative;
        width: 180px;
        height: 180px;
        margin: 0 auto 1.5rem;
      }

      .coin {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffe18b, #f6b042);
        display: grid;
        place-items: center;
        font-size: 2.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15rem;
        box-shadow:
          inset 0 10px 20px rgba(255, 255, 255, 0.6),
          inset 0 -10px 20px rgba(163, 90, 16, 0.4),
          0 18px 28px rgba(29, 34, 65, 0.25);
        transition: transform 0.2s ease;
      }

      .coin.flipping {
        animation: flip 0.7s ease-in-out;
      }

      @keyframes flip {
        0% {
          transform: rotateY(0deg) scale(1);
        }
        40% {
          transform: rotateY(180deg) scale(1.08);
        }
        70% {
          transform: rotateY(320deg) scale(0.98);
        }
        100% {
          transform: rotateY(360deg) scale(1);
        }
      }

      .result {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
      }

      button {
        border: none;
        background: #3d49f3;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        padding: 0.8rem 2rem;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 12px 20px rgba(61, 73, 243, 0.3);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 24px rgba(61, 73, 243, 0.35);
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 3px solid rgba(61, 73, 243, 0.5);
        outline-offset: 3px;
      }

      .hint {
        margin: 1.5rem 0 0;
        font-size: 0.95rem;
        color: #4b4f77;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #f5f5ff;
        }

        .card {
          background: rgba(23, 24, 48, 0.85);
        }

        p {
          color: #c1c5ff;
        }

        .result {
          color: #f5f5ff;
        }

        .hint {
          color: #c1c5ff;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Yes or No Coinflip</h1>
      <p>Tap the button for a truly 50/50 yes-or-no flip.</p>
      <div class="coin-wrapper">
        <div class="coin" id="coin" aria-live="polite">?</div>
      </div>
      <div class="result" id="result">Waiting for your flip.</div>
      <button id="flipButton" type="button">Flip again</button>
      <p class="hint">
        Open this file in your browser to use the coinflip (double-click
        <strong>index.html</strong> or use your editor’s preview).
      </p>
    </main>

    <script>
      const coin = document.getElementById("coin");
      const result = document.getElementById("result");
      const flipButton = document.getElementById("flipButton");

      const outcomes = ["Yes", "No"];

      const getRandomIndex = () => {
        if (window.crypto && window.crypto.getRandomValues) {
          const values = new Uint32Array(1);
          window.crypto.getRandomValues(values);
          return values[0] % outcomes.length;
        }
        return Math.floor(Math.random() * outcomes.length);
      };

      const flip = () => {
        if (coin.classList.contains("flipping")) return;

        coin.classList.add("flipping");
        result.textContent = "Flipping...";

        const choice = outcomes[getRandomIndex()];

        window.setTimeout(() => {
          coin.textContent = choice;
          result.textContent = `Result: ${choice}`;
          coin.classList.remove("flipping");
        }, 650);
      };

      flipButton.addEventListener("click", flip);
      flip();
    </script>
  </body>
</html>
